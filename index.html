<!DOCTYPE html>
    <html>
        <head>
            <title>solete</title>
            <link rel="stylesheet" href="style.css">
        </head>
        <body> 
            <div class="container">
                <h1>KESAVA KAKANI</h1>
                <h1>solete</h1>
                <h1>python flask with microservices</h1>
            <h2><u>Solete Internship</u></h2>
            
            <p><b>I am kesava kakani from annamacharya university!</b></p><br>
            <form id="myForm" action="save.php" method="post">
                <label>firstname:</label>
                <input type="text"id="fname" name="fname" placeholder="enter name"><br>
                <label>lastname:</label>
                <input type="text"id="lname" name="lname" placeholder="enter name"><br>
                <label>Mobile NO:</label>
                <input type="number" id="mobile" name="mobile" placeholder="enter mobile"><br>
                <label>email id:</label>
                <input type="email" id="email" name="email" placeholder="enter email id"><br>
                <label>password</label>
                <input type="password" id="password" name="password" placeholder="enter pass"><br>
                <label>enter dob</label>
                <input type="date" id="dob" name="dob" placeholder="enter DOB"><br>
                gender:<br>
                <input type="radio" name="gender" value="male">male<br>
                <input type="radio" name="gender" value="female">female<br>
                <input type="radio" name="gender" value="other">other<br>
                skills:<br>
                <input type="checkbox" name="skills[]" value="java">java<br>
                <input type="checkbox" name="skills[]" value="C">C<br>
                <input type="checkbox" name="skills[]" value="python">python<br>
                <input type="checkbox" name="skills[]" value="html">html<br>
                <input type="checkbox" name="skills[]" value="css">css<br>

                file upload:
                <input type="file"><br>
                <input type="submit">
                <p id="msg"></p>
            </form>
            </div>

            <script>
document.getElementById("myForm").addEventListener("submit", function(e) {

    let name = document.getElementById("fname").value;
    let mobile = document.getElementById("mobile").value;
    let email = document.getElementById("email").value;  
    let password = document.getElementById("password").value;
    let dob = document.getElementById("dob").value;      
    let msg = document.getElementById("msg"); 

    if(name === "" || mobile === "" || email === "" || password === "" || dob === ""){
        e.preventDefault();
        msg.innerHTML = "!please fill all fields";
        msg.style.color = "red";
        return;
    }

    if(mobile.length != 10){
        e.preventDefault();
        msg.innerHTML = "!mobile must be 10 digits";
        msg.style.color = "red";
        return;
    }

    if(!email.includes("@") || !email.includes(".")){
        e.preventDefault();
        msg.innerHTML = "!invalid email";
        msg.style.color = "red";
        return;
    }

    if(password.length < 6){
        e.preventDefault();
        msg.innerHTML = "!password must be 6+ characters";
        msg.style.color = "red";
        return;
    }

});
</script>
           
                
        </body>


    </html>
